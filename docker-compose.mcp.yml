# Optional remote MCP endpoints. Cloudflared connects to the loopback-only ports.
services:
  mcp-read:
    build: ./mcp_server
    profiles: [mcp]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Remote access is opt-in. Start it with tools/mcp-up.sh and remove it
    # again with tools/mcp-down.sh so it never returns after a host reboot.
    restart: "no"
    ports:
      - "127.0.0.1:${MCP_READ_PORT:-8765}:8000"
    environment:
      COLLECTION_API_URL: http://backend:8000
      COLLECTION_TOKEN_FILE: /run/secrets/collection_token
      MCP_MODE: read
      MCP_TRANSPORT: streamable-http
      MCP_PUBLIC_HOSTNAME: ${MCP_READ_HOSTNAME:-games-read.example.com}
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-change-me.cloudflareaccess.com}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_READ_AUD:-change-me}
    volumes:
      - type: bind
        source: ./data/integrations/read.token
        target: /run/secrets/collection_token
        read_only: true
        bind:
          create_host_path: false
  mcp-write:
    build: ./mcp_server
    profiles: [mcp]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    ports:
      - "127.0.0.1:${MCP_WRITE_PORT:-8766}:8000"
    environment:
      COLLECTION_API_URL: http://backend:8000
      COLLECTION_TOKEN_FILE: /run/secrets/collection_token
      MCP_MODE: write
      MCP_TRANSPORT: streamable-http
      MCP_PUBLIC_HOSTNAME: ${MCP_WRITE_HOSTNAME:-games-write.example.com}
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-change-me.cloudflareaccess.com}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_WRITE_AUD:-change-me}
    volumes:
      - type: bind
        source: ./data/integrations/write.token
        target: /run/secrets/collection_token
        read_only: true
        bind:
          create_host_path: false
